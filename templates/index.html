<!DOCTYPE html>
<html>
  <head>
    <title>D'Scrapper</title>
    <link
      href="{{ url_for('static', filename='output.css') }}"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="isolate bg-white px-6 py-24 sm:py-32 lg:px-8">
      <div
        aria-hidden="true"
        class="absolute inset-x-0 -top-40 -z-10 transform-gpu overflow-hidden blur-3xl sm:-top-80"
      >
        <div
          style="
            clip-path: polygon(
              74.1% 44.1%,
              100% 61.6%,
              97.5% 26.9%,
              85.5% 0.1%,
              80.7% 2%,
              72.5% 32.5%,
              60.2% 62.4%,
              52.4% 68.1%,
              47.5% 58.3%,
              45.2% 34.5%,
              27.5% 76.7%,
              0.1% 64.9%,
              17.9% 100%,
              27.6% 76.8%,
              76.1% 97.7%,
              74.1% 44.1%
            );
          "
          class="relative left-1/2 -z-10 aspect-1155/678 w-144.5 max-w-none -translate-x-1/2 rotate-30 bg-linear-to-tr from-[#ff80b5] to-[#9089fc] opacity-30 sm:left-[calc(50%-40rem)] sm:w-288.75"
        ></div>
      </div>
      <div class="mx-auto max-w-2xl text-center">
        <h2
          class="text-4xl font-semibold tracking-tight text-balance text-gray-900 sm:text-5xl"
        >
          D'Scrapper
        </h2>
        <p class="mt-2 text-lg/8 text-gray-600">
          "Extract Smarter, Work Faster."
        </p>
      </div>
      <form
        action="/run-script"
        method="POST"
        class="mx-auto mt-16 max-w-xl sm:mt-20"
      >
        <div class="grid grid-cols-1 gap-x-8 gap-y-6 sm:grid-cols-2">
          <div>
            <label
              for="first-name"
              class="block text-sm/6 font-semibold text-gray-900"
              >Nama Depan</label
            >
            <div class="mt-2.5">
              <input
                id="first-name"
                type="text"
                name="first-name"
                autocomplete="given-name"
                class="block w-full rounded-md bg-white px-3.5 py-2 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600"
              />
            </div>
          </div>
          <div>
            <label
              for="last-name"
              class="block text-sm/6 font-semibold text-gray-900"
              >Last name</label
            >
            <div class="mt-2.5">
              <input
                id="last-name"
                type="text"
                name="last-name"
                autocomplete="family-name"
                class="block w-full rounded-md bg-white px-3.5  py-2 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600"
              />
            </div>
          </div>
          <div class="sm:col-span-2">
            <label
              for="company"
              class="block text-sm/6 font-semibold text-gray-900"
              >Company</label
            >
            <div class="mt-2.5">
              <input
                id="company"
                type="text"
                name="company"
                autocomplete="organization"
                class="block w-full rounded-md bg-white  py-2 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600"
              />
            </div>
          </div>
          <div class="sm:col-span-2">
            <label
              for="ScrapeType"
              class="block text-sm/6 font-medium text-gray-900"
              >Pilih Tipe Scrapemu</label
            >
            <div class="mt-2 grid grid-cols-1">
              <select
                id="pilihan"
                name="pilihan"
                autocomplete="pilihan"
                class="col-start-1 row-start-1 w-full appearance-none rounded-md bg-white py-1.5 pr-8 pl-3 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6"
              >
                <option value="Igracias">IGracias</option>
                <option value="LHKPN">LHKPN</option>
                <option value="Minerba">Minerba</option>
              </select>
              <svg
                viewBox="0 0 16 16"
                fill="currentColor"
                data-slot="icon"
                aria-hidden="true"
                class="pointer-events-none col-start-1 row-start-1 mr-2 size-5 self-center justify-self-end text-gray-500 sm:size-4"
              >
                <path
                  d="M4.22 6.22a.75.75 0 0 1 1.06 0L8 8.94l2.72-2.72a.75.75 0 1 1 1.06 1.06l-3.25 3.25a.75.75 0 0 1-1.06 0L4.22 7.28a.75.75 0 0 1 0-1.06Z"
                  clip-rule="evenodd"
                  fill-rule="evenodd"
                />
              </svg>
            </div>
          </div>
        </div>
        <div class="mt-10">
          <button
            type="submit"
            class="block w-full rounded-md bg-indigo-600 px-3.5 py-2.5 text-center text-sm font-semibold text-white shadow-xs hover:bg-indigo-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600"
          >
            Let's talk
          </button>
        </div>
      </form>

      <div class="mx-auto max-w-2xl">
        <h3 class="text-lg font-semibold mt-12 mb-4 text-center text-gray-800">
          Log Hasil:
        </h3>
        <h1 class="text-2xl font-black mt-12 mb-4 text-center">
          👋Selamat Datang {{nama_lengkap}}
        </h1>

        {% if hasil %}
        <div
          class="bg-gray-50 text-sm font-mono text-gray-700 border border-gray-300 rounded-lg p-4 shadow-inner max-h-96 overflow-y-auto whitespace-pre-line"
        >
          {{ hasil }}
        </div>
        {% else %}
        <div
          class="bg-gray-50 text-sm text-center font-mono text-gray-700 border border-gray-300 rounded-lg p-4 shadow-inner max-h-96 overflow-y-auto whitespace-pre-line"
        >
          Anda Belum Memilih Form Diatas
        </div>

        {% endif %}
      </div>
    </div>
  </body>
</html>
